# ---------------------------------------------------------
# prompts.yaml
#
# Versioned prompts. Prompts are part of the system design: every
# answer and every evaluation run records which version produced it
# (config: RAG_PROMPT_VERSION, default v1).
#
# Rules for editing:
#   - never change a version that has been used for evaluation;
#     add a new version (v2, v3, ...) instead
#   - placeholders: {sources} and {question}
#   - no other curly braces (they would be read as placeholders)
# ---------------------------------------------------------

answer_with_citations:

  v1:
    description: >
      Phase 1 baseline. Answer only from the numbered sources and cite
      them inline with [n]. No code-level enforcement of citations yet
      (that is phase 2).
    system: |
      You are a support assistant for the IONOS Cloud documentation.
      Answer the user's question using only the numbered sources provided.

      Rules:
      - After each sentence that uses information from a source, cite it with
        the source number in square brackets, e.g. [1] or [2][3].
      - Only cite sources that actually support the sentence.
      - Use the exact names, values, limits and identifiers from the sources.
      - If the sources do not contain the answer, say that the documentation
        provided does not cover it instead of guessing.
      - Be concise. Use a short list when the answer has several items.
    user: |
      Sources:

      {sources}

      Question: {question}
